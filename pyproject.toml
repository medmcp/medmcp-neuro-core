[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project]
name = "medmcp-neuro-core"
version = "0.1.0"
description = "Neuro imaging tools for the medmcp ecosystem."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Julian McGinnis", email = "julian.mcginnis@tum.de" },
    { name = "Paul Friedrich", email = "paul.friedrich@unibas.ch" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["medical", "image processing", "ai-agent", "mcp"]
requires-python = ">=3.12"
dependencies = [
    "antspyx>=0.5",
    "hd-bet>=2.0.1",
    "mcp>=1.0",
    # torch/torchvision are pulled transitively by hd-bet; declared directly so the
    # CUDA 12.8 index pin below ([tool.uv.sources]) applies (uv sources only bind
    # direct deps). Pinned to 2.7.1 to MATCH FastSurfer's own pin so the container can
    # share a SINGLE torch + CUDA stack (one ~8 GB nvidia-cu12 set, not two) — the
    # Dockerfile installs FastSurfer's seg deps into the same venv. Keeps the GPU image
    # on cu128 — see [tool.uv] note. hd-bet only needs torch>=2.0, so 2.7.1 is fine.
    "torch==2.7.1",
    "torchvision==0.28.0",
    # "medmcp-dicom>=0.1",  # uncomment once medmcp-dicom is available
]

[project.scripts]
medmcp-neuro-core = "medmcp_neuro_core.server:main"

[project.entry-points."medmcp.stacks"]
medmcp-neuro-core = "medmcp_neuro_core.server:server_config"

# How a downstream "core" package declares this package as an optional extra:
# [project.optional-dependencies]
# neuro = ["medmcp-neuro-core>=0.1"]

[project.urls]
Homepage = "https://github.com/medmcp/medmcp-neuro-core"
Issues = "https://github.com/medmcp/medmcp-neuro-core/issues"

# Pin git-sourced medmcp packages during development:
# [tool.uv.sources]
# medmcp-dicom = { git = "https://github.com/medmcp/medmcp-dicom", branch = "main" }

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-asyncio>=1.2",
]
quality = [
    "ruff>=0.15",
    "pyright>=1.1.400",
    "pre-commit>=4.5",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
]

[tool.uv]
default-groups = ["dev"]

# Pin the PyTorch ecosystem to the CUDA 12.8 build so the GPU image runs on any
# host driver >= R570 (covers Turing through Blackwell via CUDA backward-compat).
# Newer-driver nodes run this image fine; nodes older than R570 are out of scope
# (see medmcp-dev/docs/containerization-plan.md).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "D",        # pydocstyle
]

ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
# _run_ants.py and _hdbet_serve.py are subprocess entry points whose heavy deps
# (ANTsPy / HD-BET + nnU-Net) ship partial stubs that cause spurious
# reportUnknownVariableType errors throughout — exclude rather than annotate each line.
exclude = ["src/medmcp_neuro_core/tools/_run_ants.py", "src/medmcp_neuro_core/tools/_hdbet_serve.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
