name: Image

# On push to main: build + push the neuro GPU stack image to the private GHCR.
# On pull_request: build only (validates the Dockerfile) — no push.
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (Package settings -> Manage Actions access), and base:main must already be
# published (run the core repo's Images workflow first). Single shared cu128 torch venv
# for HD-BET + antspyx + FastSurfer seg-only, plus baked HD-BET/FastSurfer weights;
# large image, so no layer caching — see the build step.
#
# Each arch builds on a NATIVE runner and the results are merged into a multi-arch
# manifest list, so ghcr.io/medmcp/neuro-core:main resolves per-arch. Do NOT collapse this
# into a single buildx --platform build: QEMU is far too slow for the CUDA/torch
# compiles here, and it would put both arches on one runner's disk (see medmcp#95).
# ubuntu-24.04-arm is free for public repos; private repos need a paid plan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref. These are long (the arm64 leg compiles antspyx from source),
# so without this a superseded push keeps a runner busy for the better part of an
# hour producing an image nobody will pull. Pull requests cancel; a push to main
# does not, because both arch legs have to finish for the merge job to assemble
# the manifest list.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the sibling arch on failure — a broken arm64 build should
      # still leave a diagnosable amd64 run, and vice versa.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Record what this runner actually has. Two arm64 builds died with no failing
      # step and no log whatsoever, so capture the resource picture up front — if it
      # happens again, at least the RAM/core count is on record next to the failure.
      - name: Runner resources
        run: |
          echo "arch: $(uname -m)  cores: $(nproc)"
          free -h || true
          df -h / | tail -1
      # The neuro image is large (one shared cu128 torch + CUDA stack for HD-BET,
      # antspyx, and FastSurfer seg-only, plus baked HD-BET/FastSurfer weights). The
      # export-for-push needs much free space, so reclaim aggressively — the default
      # cleanup (dotnet/android/toolcache) alone is not enough and the build runs out on
      # "exporting layers".
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/az \
            /usr/local/share/powershell /usr/share/miniconda /usr/local/graalvm \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo "after:"; df -h /
      - uses: docker/setup-buildx-action@v4
      # Login on every event — needed to pull the private base, even for PR builds.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          # Stream progress: both previous arm64 failures produced no log at all,
          # which made them undiagnosable. Plain progress leaves breadcrumbs.
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
            CMAKE_BUILD_PARALLEL_LEVEL=${{ matrix.arch == 'arm64' && '2' || '' }}
          tags: |
            ghcr.io/medmcp/neuro-core:${{ github.sha }}-${{ matrix.arch }}
            ghcr.io/medmcp/neuro-core:main-${{ matrix.arch }}
          # Layer cache. The dependency layer is essentially the whole arm64
          # build — 2158s of 2376s, because antspyx has no aarch64 wheel past
          # 0.4.2 and compiles from its sdist — so reusing it turns any change
          # that leaves uv.lock alone into a ~3 GB pull instead of a recompile.
          #
          # A dedicated registry ref with mode=min, not the two things that were
          # ruled out before: the GHA cache is capped around 10 GB and this image
          # is 5.8 GB compressed per arch, and mode=max exported a second copy of
          # every layer onto the runner disk ("no space left on device"). mode=min
          # stores only the final image's layers, and storing them beside the image
          # in the same GHCR repository means the blobs are shared rather than
          # duplicated. A missing ref is a warning, not a failure, so the first
          # build after this lands simply populates it.
          cache-from: type=registry,ref=ghcr.io/medmcp/neuro-core:buildcache-${{ matrix.arch }}
          # Only a push can write the cache; a PR build has nothing to export.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/medmcp/neuro-core:buildcache-{0},mode=min', matrix.arch) || '' }}

      # Verify the built image really is the architecture we think it is — the core
      # refuses to install a foreign-arch stack image (medmcp#97), so a mislabelled
      # leg would produce a manifest list uninstallable on one platform.
      - name: Check image architecture
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          got=$(docker buildx imagetools inspect \
                  "ghcr.io/medmcp/neuro-core:main-${{ matrix.arch }}" \
                  --format '{{.Image.Platform.Architecture}}')
          echo "pushed: $got, expected: ${{ matrix.arch }}"
          [ "$got" = "${{ matrix.arch }}" ] \
            || { echo "::error::image is $got, expected ${{ matrix.arch }}"; exit 1; }

  # Runs once, after BOTH arches have pushed. Merging the per-arch images into a
  # manifest list is what makes the bare tag multi-arch; without this job the
  # suffixed tags exist but ghcr.io/medmcp/neuro-core:main would not.
  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge arch tags into multi-arch manifest lists
        run: |
          for tag in "${{ github.sha }}" main; do
            docker buildx imagetools create -t "ghcr.io/medmcp/neuro-core:$tag" \
              "ghcr.io/medmcp/neuro-core:$tag-amd64" \
              "ghcr.io/medmcp/neuro-core:$tag-arm64"
          done
      - name: Verify both platforms resolve
        run: |
          insp=$(docker buildx imagetools inspect "ghcr.io/medmcp/neuro-core:main")
          echo "$insp"
          for plat in linux/amd64 linux/arm64; do
            echo "$insp" | grep -q "$plat" \
              || { echo "::error::ghcr.io/medmcp/neuro-core:main is missing $plat"; exit 1; }
          done
          echo "both platforms present"
