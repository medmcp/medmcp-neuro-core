name: Image

# On push to main: build + push the neuro GPU stack image to the private GHCR.
# On pull_request: build only (validates the Dockerfile) — no push.
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (Package settings -> Manage Actions access), and base:main must already be
# published (run medmcp-dev's Images workflow first). amd64 only for now (torch
# cu128 + antspyx + baked HD-BET weights; FreeSurfer/segment_brain not included).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The neuro image is large (CUDA torch + antspyx + baked weights); reclaim
      # space the hosted runner pre-populates so the build doesn't run out.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      # Login on every event — needed to pull the private base, even for PR builds.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
          tags: |
            ghcr.io/medmcp/neuro:${{ github.sha }}
            ghcr.io/medmcp/neuro:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
