name: Image

# Build + push the neuro GPU stack image to the private GHCR.
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (Package settings -> Manage Actions access). amd64 only for now (torch cu128 +
# antspyx + baked HD-BET weights; FreeSurfer/segment_brain not included yet).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The neuro image is large (CUDA torch + antspyx + baked weights); reclaim
      # space the hosted runner pre-populates so the build doesn't run out.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
          tags: |
            ghcr.io/medmcp/neuro:${{ github.sha }}
            ghcr.io/medmcp/neuro:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
