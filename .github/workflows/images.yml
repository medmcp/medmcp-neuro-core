name: Image

# On push to main: build + push the neuro GPU stack image to the private GHCR.
# On pull_request: build only (validates the Dockerfile) — no push.
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (Package settings -> Manage Actions access), and base:main must already be
# published (run medmcp-dev's Images workflow first). amd64 only for now (torch
# cu128 + antspyx + baked HD-BET weights + FastSurfer seg-only for segment_brain;
# ~26 GB, so no layer caching — see the build step).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The neuro image is ~26 GB (two CUDA torch stacks: the main cu128 venv + the
      # isolated FastSurfer venv, plus antspyx + baked HD-BET/FastSurfer weights). The
      # export-for-push needs that much free space, so reclaim aggressively — the default
      # cleanup (dotnet/android/toolcache) alone is not enough and the build runs out on
      # "exporting layers".
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/az \
            /usr/local/share/powershell /usr/share/miniconda /usr/local/graalvm \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo "after:"; df -h /
      - uses: docker/setup-buildx-action@v3
      # Login on every event — needed to pull the private base, even for PR builds.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
          tags: |
            ghcr.io/medmcp/neuro:${{ github.sha }}
            ghcr.io/medmcp/neuro:main
          # No GHA cache: this image is ~26 GB, far over the ~10 GB Actions-cache
          # cap, and `cache-to: mode=max` exporting a second copy of every layer
          # fills the runner disk ("no space left on device"). The build itself fits
          # on the hosted runner (after the Free-disk step), so we just skip caching.
